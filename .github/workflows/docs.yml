# 2026/10/18 16:20:00 UTC - PluginUI
# Builds the DocFX site (articles + API reference) and publishes it on GitHub Pages.
# Repository settings: Pages > Build and deployment > Source = GitHub Actions.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docfx/**'
      - 'src/**'
      - 'samples/PluginUI.DemoSynth/README*.md'
      - 'README*.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the site
        run: |
          dotnet tool restore
          dotnet docfx docfx/docfx.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docfx/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
