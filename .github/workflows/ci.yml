# 2026/10/18 16:20:00 UTC - PluginUI
# Build and tests on every push and pull request: Linux (libraries, tests) and Windows (also NativeAOT + validator).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Linux (build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build PluginUI.slnx -c Release
      - name: Test
        run: dotnet test PluginUI.slnx -c Release --no-build --logger "console;verbosity=normal"

  windows:
    name: Windows (build, tests, NativeAOT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build PluginUI.slnx -c Release
      - name: Test
        run: dotnet test PluginUI.slnx -c Release --no-build
      - name: NativeAOT plug-in (x86-64-v3) and Steinberg validator
        shell: pwsh
        run: |
          pwsh build/Build-Release.ps1 -Stage Build -Target x64-v3
          pwsh build/Build-Release.ps1 -Stage Validate -ValidatePath artifacts/stage/x64-v3/plugin/PluginUI.DemoSynth.vst3
