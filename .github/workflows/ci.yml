# 2026/10/18 17:31:00 UTC - PluginUI
# Build and tests on every push and pull request: Linux (libraries, tests) and Windows (also NativeAOT + validator).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  linux:
    name: Linux (build, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build PluginUI.slnx -c Release
      - name: Test
        run: dotnet test PluginUI.slnx -c Release --no-build --logger "console;verbosity=normal"

  windows:
    name: Windows (build, tests, NativeAOT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build PluginUI.slnx -c Release
      - name: Test
        run: dotnet test PluginUI.slnx -c Release --no-build
      - name: NativeAOT plug-in (x86-64-v3)
        shell: pwsh
        run: pwsh build/Build-Release.ps1 -Stage Build -Target x64-v3
      - name: Steinberg validator
        shell: pwsh
        run: pwsh build/Build-Release.ps1 -Stage Validate -ValidatePath artifacts/stage/x64-v3/plugin/PluginUI.DemoSynth.vst3
