# 2026/10/18 17:31:00 UTC - PluginUI
# Release on a tag vX.Y.Z: NativeAOT builds for x64 (x86-64-v3, x86-64-v2) and ARM64 on native runners, the universal
# VST3 bundle (x64 loader + ARM64), application packages, Steinberg validation on both architectures, the GitHub
# release and the NuGet packages (trusted publishing on nuget.org, when the repository variable PUBLISH_NUGET is 'true'
# and NUGET_USER holds the nuget.org user name).
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no release is published when run manually)'
        required: true
        default: '0.0.0-test'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Version format, VersionPrefix and CHANGELOG section
        run: |
          if [ -n "$VERSION" ]; then version="$VERSION"; else version="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'; then
            echo "::error::Invalid version '$version': expected X.Y.Z or X.Y.Z-prerelease."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            core="${version%%-*}"
            prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
            if [ "$core" != "$prefix" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match VersionPrefix $prefix in Directory.Build.props."; exit 1
            fi
            if ! grep -Eq "^## \[$core\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$core]' section."; exit 1
            fi
          fi
          echo "Version $version"

  build-x64:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64-v3, x64-v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Tests
        if: matrix.target == 'x64-v3'
        run: dotnet test PluginUI.slnx -c Release
      - name: NativeAOT build
        shell: pwsh
        run: pwsh build/Build-Release.ps1 -Stage Build -Target ${{ matrix.target }} $(if ($env:VERSION) { "-Version", $env:VERSION })
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-${{ matrix.target }}
          path: artifacts/stage/${{ matrix.target }}
          if-no-files-found: error

  build-arm64:
    name: Build arm64
    needs: check
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Tests
        run: dotnet test PluginUI.slnx -c Release
      - name: NativeAOT build
        shell: pwsh
        run: pwsh build/Build-Release.ps1 -Stage Build -Target arm64 $(if ($env:VERSION) { "-Version", $env:VERSION })
      - name: Steinberg validator
        shell: pwsh
        run: pwsh build/Build-Release.ps1 -Stage Validate -ValidatePath artifacts/stage/arm64/plugin/PluginUI.DemoSynth.vst3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage-arm64
          path: artifacts/stage/arm64
          if-no-files-found: error

  package:
    name: Package and validate (x64)
    needs: [build-x64, build-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: stage-*
          path: artifacts/stage
      - name: Arrange the stage folders
        shell: pwsh
        run: |
          Get-ChildItem artifacts/stage -Directory -Filter 'stage-*' | ForEach-Object { Rename-Item $_.FullName ($_.Name -replace '^stage-', '') }
          Get-ChildItem artifacts/stage
      - name: Visual Studio developer environment (cl.exe for the VST3 loader)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Package
        shell: pwsh
        run: pwsh build/Build-Release.ps1 -Stage Package $(if ($env:VERSION) { "-Version", $env:VERSION })
      - name: Validate (x86-64-v3, x86-64-v2, loader)
        shell: pwsh
        run: pwsh build/Build-Release.ps1 -Stage Validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: artifacts/release
          if-no-files-found: error

  validate-arm64-bundle:
    name: Validate the universal bundle on ARM64
    needs: package
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: artifacts/release
      - name: Validate
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts/release -Filter '*-vst3-universal.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath artifacts/universal
          pwsh build/Build-Release.ps1 -Stage Validate -ValidatePath artifacts/universal/PluginUI.DemoSynth.vst3

  publish:
    name: Publish
    if: github.event_name == 'push'
    needs: [package, validate-arm64-bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: artifacts/release
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::Empty CHANGELOG section for $version."; exit 1; fi
          cat notes.md
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: vars.PUBLISH_NUGET == 'true'
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (trusted publishing)
        if: vars.PUBLISH_NUGET == 'true'
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push NuGet packages
        if: vars.PUBLISH_NUGET == 'true'
        run: |
          dotnet nuget push "artifacts/release/nuget/*.nupkg" --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
      # After NuGet, and re-runnable: an existing release gets its files replaced.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(artifacts/release/*.zip artifacts/release/SHA256SUMS.txt artifacts/release/nuget/*.nupkg)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            prerelease=""
            case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" --title "PluginUI ${GITHUB_REF_NAME#v}" --notes-file notes.md $prerelease "${files[@]}"
          fi
